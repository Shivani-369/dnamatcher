<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>KMP DNA Sequence Matcher</title>
    <script src="https://cdn.anychart.com/releases/8.11.1/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.11.1/js/anychart-pie.min.js"></script>
    <style>
        body {
            background-color: #121212;
            background-image: url('image.jpg');
            background-size: cover;
            background-position: center;
            color: #00ff88;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1, h2 {
            color: #00e6ff;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #00ff88;
        }
        input, button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            background: #282828;
            color: #00e6ff;
            border: 1px solid #00ff88;
            border-radius: 5px;
            width: 100%;
        }
        button:hover {
            background: #00ff88;
            color: #121212;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00e6ff;
            border-radius: 5px;
            font-size: 18px;
        }
        #pieChart {
            width: 100%;
            height: 400px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KMP DNA Sequence Matcher</h1>
        <h2>Enter the genome sequence and pattern to search:</h2>
        <input type="text" id="text" placeholder="Enter genome sequence...">
        <input type="text" id="pattern" placeholder="Enter pattern to search...">
        <button onclick="runKMP()">Search</button>
        <div id="result"></div>
        <div id="pieChart"></div>
    </div>

    <script>
        function computeLPSArray(pattern, m, lps) {
            let len = 0;
            lps[0] = 0;
            let i = 1;
            while (i < m) {
                if (pattern[i] == pattern[len]) {
                    len++;
                    lps[i] = len;
                    i++;
                } else {
                    if (len != 0) {
                        len = lps[len - 1];
                    } else {
                        lps[i] = 0;
                        i++;
                    }
                }
            }
        }

        function KMPSearch(pattern, text) {
            const m = pattern.length;
            const n = text.length;
            const lps = [];
            computeLPSArray(pattern, m, lps);

            const matches = [];
            let i = 0;
            let j = 0;

            while (i < n) {
                if (pattern[j] == text[i]) {
                    j++;
                    i++;
                }
                if (j == m) {
                    matches.push(i - j);
                    j = lps[j - 1];
                } else if (i < n && pattern[j] != text[i]) {
                    if (j != 0) j = lps[j - 1];
                    else i++;
                }
            }

            return matches;
        }

        function runKMP() {
            const text = document.getElementById("text").value;
            const pattern = document.getElementById("pattern").value;
            const resultDiv = document.getElementById("result");

            if (text.length === 0 || pattern.length === 0) {
                resultDiv.innerHTML = "Please enter both genome sequence and pattern.";
                return;
            }

            const matches = KMPSearch(pattern, text);
            const totalChars = text.length;
            const matchedChars = new Set();
            for (const matchIndex of matches) {
                for (let i = matchIndex; i < matchIndex + pattern.length; i++) {
                    if (i < totalChars) matchedChars.add(i);
                }
            }
            const matchPct = (matchedChars.size * 100) / totalChars;
            const cappedMatchPct = Math.min(matchPct, 100);

            resultDiv.innerHTML = `
                Pattern found at indices: ${matches.join(", ")} <br>
                Match Percentage: ${cappedMatchPct.toFixed(2)}%
            `;

            // Pie chart
            anychart.onDocumentReady(function () {
                const data = [
                    {x: "Match", value: cappedMatchPct},
                    {x: "No Match", value: 100 - cappedMatchPct}
                ];

                const chart = anychart.pie();
                chart.data(data);
                chart.title("KMP DNA Sequence Match Result");
                chart.container("pieChart");
                chart.draw();
            });
        }
    </script>
</body>
</html>
